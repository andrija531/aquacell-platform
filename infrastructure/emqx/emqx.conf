## EMQX 5.x configuration (HOCON).
##
## Decision #53: per-device credentials, never a shared username/password.
## Homeowners can read their own Shelly config, so one extracted shared
## credential would compromise the whole fleet.
##
## Environment variables prefixed EMQX_ override anything set here.

node {
  data_dir = "/opt/emqx/data"
}

## ---------------------------------------------------------------------------
## Authentication
##
## Configuring any authenticator makes EMQX reject clients it cannot
## authenticate. There is no separate allow_anonymous flag in 5.x — an empty
## `authentication` list is what allows anonymous connections, so this block
## must not be removed.
##
## Devices are provisioned into the built-in database at commissioning time.
## Swap `built_in_database` for `postgresql` once the device registry in
## Postgres is the source of truth.
## ---------------------------------------------------------------------------
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

## ---------------------------------------------------------------------------
## Authorization
##
## no_match = deny means a topic not explicitly allowed in acl.conf is
## refused. Default-deny is the point; do not relax it.
## ---------------------------------------------------------------------------
authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
    max_size = 32
    ttl = 1m
  }
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## ---------------------------------------------------------------------------
## Listeners
## ---------------------------------------------------------------------------
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
  ## Plaintext. docker-compose.yml binds this to 127.0.0.1 only.
  ## Disable it entirely before any device connects over a real network.
  enable = true
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 100000
  enable = true
  ssl_options {
    ## The image ships self-signed certs at these paths. They are fine for
    ## local work and unacceptable in production.
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
    certfile = "/opt/emqx/etc/certs/cert.pem"
    keyfile = "/opt/emqx/etc/certs/key.pem"
    versions = ["tlsv1.3", "tlsv1.2"]

    ## INSECURE DEFAULT, deliberately visible.
    ##
    ## Decision #53 calls for mTLS client certificates where the Shelly
    ## provisioning flow can carry them. That is not wired up yet, and
    ## turning it on without a real CA and per-device certs stops the broker
    ## from booting — which would make this scaffold useless.
    ##
    ## Before Phase 1, replace the certs above with a real CA and set:
    ##     verify = verify_peer
    ##     fail_if_no_peer_cert = true
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

## Not used by this project. Leave off to reduce attack surface.
listeners.ws.default   { enable = false }
listeners.wss.default  { enable = false }
listeners.quic.default { enable = false }

## ---------------------------------------------------------------------------
## MQTT session behaviour
##
## Devices report on change plus a heartbeat (decision #35), so sessions are
## long-lived and mostly idle. keepalive is negotiated per client; the
## multiplier controls how long EMQX waits before declaring a client gone.
## ---------------------------------------------------------------------------
mqtt {
  max_packet_size = 1MB
  keepalive_multiplier = 1.5
  ## Retain the last will so the core engine learns about ungraceful drops.
  ## Fleet-wide correlated drops are a delivery risk (decision #44), so these
  ## events are recorded, not just logged.
  max_topic_levels = 8
}

## ---------------------------------------------------------------------------
## Dashboard. Password comes from EMQX_DASHBOARD__DEFAULT_PASSWORD.
## ---------------------------------------------------------------------------
dashboard {
  listeners.http {
    bind = 18083
  }
}

log {
  console {
    enable = true
    level = warning
  }
}
