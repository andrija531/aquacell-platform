%%--------------------------------------------------------------------
%% EMQX 5.x access control list.
%%
%% Format:  {Permission, Who, Action, [Topic, ...]}.
%% Evaluated top to bottom, first match wins. Anything that falls through
%% hits `no_match = deny` in emqx.conf.
%%
%% Decision #53: every client is scoped to its own topic prefix. A device
%% must not be able to read another device's telemetry or publish another
%% device's commands.
%%
%% Topic scheme:
%%   aquacell/<clientid>/status      device -> server, relay state + power
%%   aquacell/<clientid>/telemetry   device -> server, report-on-change
%%   aquacell/<clientid>/will        device -> server, last will
%%   aquacell/<clientid>/cmd         server -> device, relay commands
%%--------------------------------------------------------------------

%% --- Core engine (Erlang) -------------------------------------------
%% Ingests via shared subscription, e.g. $share/ingest/aquacell/+/status
%% (decision #30). EMQX applies ACL to the topic beneath the $share prefix,
%% so the plain filter is what needs allowing here.
{allow, {username, "core_engine"}, subscribe, ["aquacell/+/status", "aquacell/+/telemetry", "aquacell/+/will"]}.
{allow, {username, "core_engine"}, publish, ["aquacell/+/cmd"]}.

%% --- Devices --------------------------------------------------------
%% ${clientid} is substituted per connection, so one rule covers the fleet
%% while still confining each device to its own prefix.
{allow, all, publish, ["aquacell/${clientid}/status", "aquacell/${clientid}/telemetry", "aquacell/${clientid}/will"]}.
{allow, all, subscribe, ["aquacell/${clientid}/cmd"]}.

%% --- Explicit denials -----------------------------------------------
%% Redundant given no_match = deny, but a bare "#" subscription is the single
%% most damaging mistake available here, so it is refused by name.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}, {eq, "aquacell/#"}]}.

%% --- Catch-all ------------------------------------------------------
{deny, all}.
