%%--------------------------------------------------------------------
%% EMQX 5.x access control list.
%%
%% Format:  {Permission, Who, Action, [Topic, ...]}.
%% Evaluated top to bottom, first match wins. Anything that falls through
%% hits `no_match = deny` in emqx.conf.
%%
%% Decision #53: every client is scoped to its own topic prefix. A device must
%% not be able to read another device's telemetry or command another device.
%%
%%--------------------------------------------------------------------
%% TOPIC SCHEME
%%
%% This follows the Shelly Gen2+/Gen3 native MQTT scheme rather than an
%% invented one, because the firmware's topic layout is not configurable
%% beyond `topic_prefix`. Fighting it would mean running a translation script
%% on the device, which is more moving parts on the least reliable hop.
%%
%% Each device is provisioned with topic_prefix = aquacell/<device_id>, so the
%% fleet lives under one namespace and ${clientid} can scope it. The Shelly's
%% MQTT client_id defaults to its device_id, which is what makes this work.
%%
%%   Device -> server
%%     aquacell/<did>/online              LWT, "true" / "false"
%%     aquacell/<did>/events/rpc          NotifyStatus / NotifyEvent
%%     aquacell/<did>/status/<comp>:<id>  full component status (status_ntf)
%%     aquacell/ctl/<did>/rpc             RPC responses
%%
%%   Server -> device
%%     aquacell/<did>/rpc                 RPC requests
%%
%% On the response channel: a Shelly replies to "<src>/rpc", where <src> is
%% whatever the caller put in the request frame. Setting src per device to
%% aquacell/ctl/<did> means the reply topic still contains the device id, so
%% it can be scoped with ${clientid}. A single shared reply topic would let
%% any device forge responses on behalf of any other.
%%
%% MQTT control (<prefix>/command/...) is NOT allowed and is disabled on the
%% device via enable_control=false. It is a second, weaker control path, and
%% it makes the device subscribe to the fleet-wide "shellies/command" topic —
%% a broadcast channel that would let one compromised client address every
%% Shelly on the broker. RPC alone is enough and is per-device.
%%--------------------------------------------------------------------

%% --- Core engine (Erlang) -------------------------------------------
%% Production ingest will use shared subscriptions, e.g.
%% $share/ingest/aquacell/+/status/# (decision #30). EMQX applies ACL to the
%% topic beneath the $share prefix, so the plain filters below cover both the
%% POC's single connection and the sharded version.
{allow, {username, "core_engine"}, publish, ["aquacell/+/rpc"]}.
{allow, {username, "core_engine"}, subscribe,
        ["aquacell/+/online",
         "aquacell/+/events/rpc",
         "aquacell/+/status/#",
         "aquacell/ctl/+/rpc"]}.

%% --- Shelly devices --------------------------------------------------
%% ${clientid} is substituted per connection, so one rule covers the fleet
%% while confining each device to its own prefix.
{allow, all, publish,
        ["aquacell/${clientid}/online",
         "aquacell/${clientid}/events/rpc",
         "aquacell/${clientid}/status/#",
         "aquacell/ctl/${clientid}/rpc"]}.
{allow, all, subscribe, ["aquacell/${clientid}/rpc"]}.

%% --- Explicit denials -----------------------------------------------
%% Redundant given no_match = deny, but a bare "#" subscription is the single
%% most damaging mistake available here, so it is refused by name. Same for
%% the Shelly broadcast command topic.
{deny, all, subscribe,
       ["$SYS/#",
        {eq, "#"},
        {eq, "+/#"},
        {eq, "aquacell/#"}]}.
{deny, all, publish, [{eq, "shellies/command"}, "shellies/#"]}.

%% --- Catch-all ------------------------------------------------------
{deny, all}.
