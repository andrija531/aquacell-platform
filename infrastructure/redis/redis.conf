# Redis configuration for AquaCell.
#
# Redis carries schedules from the Python scheduler to the Erlang core as a
# Stream with consumer groups (decision #37). Pub/Sub was rejected: it
# silently drops schedules whenever the consumer is down, and the plan
# contradicted itself on this point.

bind 0.0.0.0
protected-mode yes
port 6379

dir /data

# --- Durability -----------------------------------------------------------
# A dropped schedule is a device left on a stale plan, so the stream has to
# survive a restart. AOF every second: at most one second of schedules lost,
# which is recoverable because the next solve is at most 15 minutes away
# (decision #27).
appendonly yes
appendfilename "aquacell.aof"
appendfsync everysec

# RDB as a second net.
save 900 1
save 300 10

# --- Memory ---------------------------------------------------------------
# noeviction is not a tuning preference, it is a correctness requirement.
# Any eviction policy will silently discard stream entries under pressure,
# which is the exact failure mode Streams was chosen to avoid. Prefer a
# failed write that the scheduler can see and retry.
maxmemory 512mb
maxmemory-policy noeviction

# --- Misc -----------------------------------------------------------------
timeout 0
tcp-keepalive 300
loglevel notice

# Trimming is the producer's job via XADD MAXLEN, not a server setting, so
# that the replay window is an explicit decision in the scheduler code.
