# AquaCell Phase 0 local infrastructure.
#
# Starts only the three third-party services. The application containers
# (core_engine, scheduler) are not here yet because they are not built yet —
# see README.md for the build order and docs/04-decision-register.md §J.
#
# Every port is bound to 127.0.0.1 on purpose. Nothing in this file is
# hardened for a public network: see the SECURITY note in README.md before
# exposing 1883/8883 to the internet.

name: aquacell

services:
  emqx:
    image: emqx/emqx:5.8.6
    container_name: aquacell-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?set EMQX_NODE_COOKIE in .env}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD in .env}
    ports:
      - "127.0.0.1:1883:1883"    # MQTT, plaintext, local development only
      - "127.0.0.1:8883:8883"    # MQTT over TLS — requires certs, see README
      - "127.0.0.1:18083:18083"  # dashboard
    volumes:
      - ./infrastructure/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./infrastructure/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  timescaledb:
    # -ha variant, not plain timescaledb: it bundles timescaledb_toolkit,
    # which provides percentile_agg. Decision #19 requires p90 quantiles
    # rather than means, and percentile_agg is how that is computed in a
    # continuous aggregate.
    image: timescale/timescaledb-ha:pg17.2-ts2.17.2
    container_name: aquacell-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquacell}
      POSTGRES_USER: ${POSTGRES_USER:-aquacell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./infrastructure/postgres/init_timescale.sql:/docker-entrypoint-initdb.d/10-init_timescale.sql:ro
      - timescale-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquacell} -d ${POSTGRES_DB:-aquacell}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: aquacell-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  emqx-data:
  timescale-data:
  redis-data:
